spring:
  application:
    name: sids-core-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:sids}}
    username: ${DATABASE_USER:sids_user}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_MAX_POOL_SIZE:10}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${CORE_API_MAX_MULTIPART_SIZE:8MB}
      max-request-size: ${CORE_API_MAX_MULTIPART_REQUEST_SIZE:9MB}
server:
  port: ${CORE_API_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
sids:
  auth:
    issuer: ${AUTH_ISSUER:sids-core-api}
    audience: ${AUTH_AUDIENCE:sids-web}
    secret: ${AUTH_JWT_SECRET}
    token-minutes: ${AUTH_TOKEN_MINUTES:120}
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    service-token: ${AI_SERVICE_TOKEN}
    connect-timeout: ${AI_CONNECT_TIMEOUT:2s}
    read-timeout: ${AI_READ_TIMEOUT:20s}
  storage:
    local-root: ${STORAGE_LOCAL_ROOT:.data/private-images}
  upload:
    max-bytes: ${CORE_API_MAX_IMAGE_BYTES:8388608}
    max-pixels: ${CORE_API_MAX_IMAGE_PIXELS:20000000}
  cors:
    allowed-origin: ${WEB_ORIGIN:http://localhost:5173}
logging:
  level:
    com.agrosense: INFO
