spring:
  application:
    name: core-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/sids}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8080/realms/sids}
  data:
    redis:
      host: ${VALKEY_HOST:localhost}
      port: ${VALKEY_PORT:6379}

server:
  port: 8081

logging:
  level:
    com.agrosense: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.flywaydb: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v1/api-docs
  swagger-ui:
    path: /v1/swagger-ui.html

agrosense:
  storage:
    provider: ${STORAGE_PROVIDER:local} # s3 or local
    s3:
      endpoint: ${STORAGE_S3_ENDPOINT:http://localhost:9000}
      region: ${STORAGE_S3_REGION:us-east-1}
      bucket: ${STORAGE_S3_BUCKET:sids-objects}
      access-key: ${STORAGE_S3_ACCESS_KEY:minioadmin}
      secret-key: ${STORAGE_S3_SECRET_KEY:minioadmin}
