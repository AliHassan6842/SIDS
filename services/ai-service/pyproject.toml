[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "sids-ai"
version = "0.1.0"
description = "SIDS AI Inference Service"
authors = ["SIDS Team"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = "^0.27.0"
pydantic = "^2.6.0"
pydantic-settings = "^2.2.0"
numpy = "^1.26.0"
pillow = "^10.2.0"
valkey = "^6.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
httpx = "^0.27.0"
mypy = "^1.8.0"
ruff = "^0.3.0"
