name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install pytest==8.4.2 jsonschema==4.25.1 referencing==0.36.2 pydantic==2.11.7
      - run: python -m pytest packages/contracts/tests

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install poetry==2.1.3
      - run: poetry install --with dev --no-interaction --no-ansi
      - run: poetry run ruff check src tests
      - run: poetry run mypy src
      - run: poetry run pytest

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: chmod +x services/core-api/mvnw
      - run: services/core-api/mvnw -f services/core-api/pom.xml clean test
      - run: services/core-api/mvnw -f services/core-api/pom.xml package -DskipTests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  playwright:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run e2e
        env:
          CI: "true"

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose --env-file .env -f infra/docker-compose.yml config --quiet
      - run: docker compose --env-file .env -f infra/docker-compose.yml build ai-service core-api
      - run: docker compose --env-file .env -f infra/docker-compose.yml up -d --wait db
      - run: docker compose --env-file .env -f infra/docker-compose.yml ps
      - if: always()
        run: docker compose --env-file .env -f infra/docker-compose.yml down
